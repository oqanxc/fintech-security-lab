
openapi: 3.0.3

info:
  title: Fintech Security Lab API
  version: 1.0.0
  description: Flask application API definition

servers:
  - url: http://localhost:5000

paths:
  /greet:
    get:
      summary: Greeting endpoint
      parameters:
        - name: name
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Successful response

  /fetch:
    post:
      summary: SSRF test endpoint
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: URL to be fetched by the server
                  example: "http://vulnerableapp.com/"
      responses:
        "200":
          description: Successful response
        "400":
          description: Invalid URL
        "502":
          description: Upstream request failed

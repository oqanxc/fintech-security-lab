name: Fintech Security Lab Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  

jobs:
  sast_Semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Semgrep SAST Scan
        run: |
          echo "=== Installing Semgrep ==="
          pip install semgrep
          
          echo "=== Running Semgrep and Generating SARIF ==="
          semgrep scan \
          --config=auto \
          --severity ERROR \
          --sarif \
          --output=semgrep.sarif \
          --error \
          --verbose

      - name: Upload Semgrep SARIF to GitHub Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'semgrep.sarif'
          category: 'semgrep-sast'



  sast_Bandit:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit bandit-sarif-formatter

      - name: Run Bandit (SAST Scan)
        run: |
          echo "=== Running Bandit SAST Scanner ==="
          bandit -r . -f sarif -o bandit-results.sarif

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'bandit-results.sarif'
          category: 'bandit-sast'

      - name: Upload Bandit SARIF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sarif
          path: bandit-results.sarif

  sast_CodeQL:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python','javascript-typescript' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      - name: CodeQL Gate
        run: |
          shopt -s nullglob
          sarif_files=(sarif-results/*.sarif)

          if [ ${#sarif_files[@]} -eq 0 ]; then
            echo "::error::No SARIF files found!"
            exit 1
          fi

          echo "SARIF files found: ${#sarif_files[@]}"

          jq -s '
            [
              .[].runs[] as $run
              | $run.results[]?
              | . as $result
              | (
                  (
                    if $result.ruleIndex != null
                    then $run.tool.driver.rules[$result.ruleIndex]
                    else null
                    end
                  )
                  // (
                    first(
                      $run.tool.driver.rules[]?
                      | select(.id == $result.ruleId)
                    ) // {}
                  )
                ) as $rule
              | (
                  ($rule.properties["security-severity"] // "0")
                  | tonumber
                ) as $severity
              | select($severity >= 7.0)
              | {
                  severity: $severity,
                  ruleId: $result.ruleId,
                  uri: ($result.locations[0].physicalLocation.artifactLocation.uri // "unknown"),
                  line: ($result.locations[0].physicalLocation.region.startLine // 0),
                  message: ($result.message.text // "")
                }
            ]
          ' "${sarif_files[@]}" > "$RUNNER_TEMP/codeql-high-findings.json"

          count=$(jq 'length' "$RUNNER_TEMP/codeql-high-findings.json")

          echo "High/Critical findings: $count"

          jq -r '.[] | "\(.severity) | \(.ruleId) | \(.uri):\(.line) | \(.message)"' \
            "$RUNNER_TEMP/codeql-high-findings.json"

          if [ "$count" -gt 0 ]; then
            echo "::error::CodeQL found $count High/Critical findings. Failing the job."
            exit 1
          fi

          echo "No High/Critical findings."

  secret_scan:
    name: Secrets (Trufflehog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret Scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@v3.99.9
        with:
          extra_args: --debug

  k8s_manifest_scan:
    name: K8s IaC Security (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Trivy K8s Manifest Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'sarif'
          output: 'trivy-k8s-results.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          trivyignores: '.trivyignore'
        env:
          TRIVY_NO_CACHE: 'true'
          TRIVY_SEVERITY: 'HIGH,CRITICAL'

      - name : Debug - Trivy K8s Human Readable Output
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'table'
          exit-code: '0'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

      - name: Upload K8s SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-k8s-results.sarif') != ''
        with:
          sarif_file: 'trivy-k8s-results.sarif'
          category: 'trivy-k8s'
      
      - name: Upload K8s SARIF Artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-k8s-results.sarif') != ''
        with:
          name: trivy-k8s-sarif
          path: trivy-k8s-results.sarif


  sca_scan:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: write
    steps:
      - name: Checkout Code

        uses: actions/checkout@v7

        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker Image
        run: |
          docker build --no-cache -t fintech-security-lab:latest .

      - name: Check installed Python packages
        run: |
            docker run --rm fintech-security-lab:latest python -c "import msgpack, urllib3; print('msgpack:', msgpack.__version__); print('urllib3:', urllib3.__version__); print('urllib3 path:', urllib3.__file__)"
            docker run --rm fintech-security-lab:latest sh -c "find / -iname '*msgpack*' 2>/dev/null" || true
            docker run --rm fintech-security-lab:latest sh -c "find /usr/local/lib/python3.11/site-packages/pip/_vendor/urllib3 -maxdepth 1" || true
            docker run --rm fintech-security-lab:latest sh -c "cat /usr/local/lib/python3.11/site-packages/pip/_vendor/urllib3/_version.py 2>/dev/null || echo '_version.py not found'"
            docker run --rm fintech-security-lab:latest sh -c "grep -RniE '__version__|version_info' /usr/local/lib/python3.11/site-packages/pip/_vendor/urllib3 2>/dev/null | head -20" || true
            docker run --rm fintech-security-lab:latest sh -c "cat /usr/local/lib/python3.11/site-packages/pip-26.2.1.dist-info/METADATA 2>/dev/null | grep -i urllib3" || true
            


      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'fintech-security-lab:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          scanners: 'vuln'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          trivyignores: '.trivyignore'
        env:
          TRIVY_NO_CACHE: 'true'
          TRIVY_SEVERITY: 'HIGH,CRITICAL'

      - name: Debug - Trivy Human Readable Output
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'fintech-security-lab:latest'
          format: 'table'
          scanners: 'vuln'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Docker push to GitHub Container Registry
        if: success() && github.event_name == 'push'
        run: |
          docker tag fintech-security-lab:latest ghcr.io/${{ github.repository_owner }}/fintech-security-lab:latest
          docker push ghcr.io/${{ github.repository_owner }}/fintech-security-lab:latest

      - name: Generate SBOM
        if: success() && github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/fintech-security-lab:latest'
          format: 'cyclonedx'
          output: 'sbom.json'

      - name: Upload SBOM Artifact
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'

      - name: Upload Trivy SARIF Artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif

  
  sign_image:
      name: Sign Image (Cosign Keyless)
      runs-on: ubuntu-latest
      needs: [sast_Bandit, sast_CodeQL, secret_scan, sca_scan, k8s_manifest_scan, sast_Semgrep]
      if: github.event_name == 'push'
      permissions:
        id-token: write
        packages: write
      steps:
        - name: Install Cosign
          uses: sigstore/cosign-installer@v4.1.2

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Sign Image (Keyless via OIDC)
          run: |
            cosign sign --yes ghcr.io/${{ github.repository_owner }}/fintech-security-lab:latest

        - name: Verify Keyless Signature
          run: |
            cosign verify ghcr.io/${{ github.repository_owner }}/fintech-security-lab:latest \
              --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/fintech-security-lab" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
              
  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: sign_image
    environment: staging
    steps:
      - name: Simulate staging deployment
        run: |
          echo "Deploying ghcr.io/${{ github.repository_owner }}/fintech-security-lab:latest to STAGING..."
          echo "(No real cluster connected — this step demonstrates the promotion flow)"
  

  dast_scan:
    name: DAST (OWASP ZAP - Multi-Target)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    needs: deploy_staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull & Run Flask App (image from GHCR)
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/fintech-security-lab:latest
          docker pull $IMAGE
          docker run -d --name test-flask-app -p 5000:5000 $IMAGE
          sleep 5
          docker ps -a
          docker logs test-flask-app || true
          sleep 5
   # Check if both apps are running   
      - name: Install & Update Node.js Dependencies
        run: |
          npm install express
          npm install ip-address@10.7.6
          npm install body-parser@2.4.0

          npm ls body-parser ip-address
          npm audit

      - name: Install & Run Node.js App
        run: |
          node app.js &
          sleep 5
          
          curl -I "http://localhost:5000/greet?name=test"
          curl -I "http://localhost:3000/os-cmd/ping?host=127.0.0.1"
          

      
      - name: Prepare ZAP Output Dir
        run: |
          mkdir -p zap_out
          chmod 777 zap_out
          chmod 666 zap_rules.tsv || true

      # ZAP Even if Vulnerability Found: Flask App (Node.js scan will run regardless of Flask scan result)
      - name: OWASP ZAP Scan - Flask App
        run: |
          mkdir -p zap_out

          rc=0

          docker run --net=host \
            -v $(pwd)/openapi.yaml:/zap/wrk/openapi.yaml:ro \
            -v $(pwd)/zap_out:/zap/wrk/out:rw \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-api-scan.py \
            -t /zap/wrk/openapi.yaml \
            -f openapi \
            -r /zap/wrk/out/zap_report_api.html \
            -J /zap/wrk/out/zap_report_api.json \
            -I || rc=$?

          echo "API_RC=$rc" >> $GITHUB_ENV

      # ZAP Even if Vulnerability Found: Node.js App (Flask scan result does not affect Node.js scan)
      - name: OWASP ZAP Scan - Node.js App
        run: |
          rc=0
          docker run --net=host \
            -v $(pwd)/zap_rules.tsv:/zap/wrk/zap_rules.tsv:ro \
            -v $(pwd)/zap_out:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:2.17.0 zap-full-scan.py \
            -t "http://localhost:3000/os-cmd/ping?host=127.0.0.1" \
            -c zap_rules.tsv \
            -r zap_report_node.html \
            -J zap_report_node.json \
            -P 8091 -I || rc=$?
          echo "NODE_RC=$rc" >> $GITHUB_ENV

      # Upload ZAP Reports as Artifacts
      - name: Upload All ZAP Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-multi-app-reports
          path: zap_out/

      # Last check for vulnerabilities and fail the job if any are found
      - name: Evaluate DAST Security Gate
        run: |
          for pair in "API:$API_RC" "Node:$NODE_RC"; do
          name=${pair%%:*}
          rc=${pair##*:}

          if [ "$rc" = "1" ]; then
            echo "::error::$name: DAST bulgusu var (ZAP exit 1)"
            failed=1
          elif [ "$rc" != "0" ]; then
            echo "::error::$name: ZAP çalışamadı veya uyarı verdi (exit '$rc')"
            failed=1
            fi
          done
          [ -z "$failed" ] || exit 1
           
      - name: Stop and Remove Container
        if: always()
        run: |
          docker stop test-flask-app || true
          docker rm test-flask-app   || true

  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: dast_scan
    environment: production
    steps:
      - name: Simulate production deployment
        run: |
          echo "Deploying ghcr.io/${{ github.repository_owner }}/fintech-security-lab:latest to PRODUCTION..."
          echo "(No real cluster connected — this step demonstrates the approval gate)"

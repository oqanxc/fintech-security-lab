name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write

jobs:

  

  sast_scan:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit bandit-sarif-formatter

      - name: Run Bandit (SAST Scan)
        run: |
          echo "=== Running Bandit SAST Scanner ==="
          bandit -r . -f sarif -o bandit-results.sarif

      - name: Upload Bandit SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'bandit-results.sarif'
          category: 'bandit-sast'

      - name: Upload Bandit SARIF Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sarif
          path: bandit-results.sarif

  sast_codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python','javascript-typescript' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  secret_scan:
    name: Secrets (Trufflehog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret Scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --debug

  k8s_manifest_scan:
    name: K8s IaC Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Trivy K8s Manifest Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'sarif'
          output: 'trivy-k8s-results.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          trivyignores: '.trivyignore'
        env:
          TRIVY_NO_CACHE: 'true'
          TRIVY_SEVERITY: 'HIGH,CRITICAL'

      - name : Debug - Trivy K8s Human Readable Output
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'table'
          exit-code: '0'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

      - name: Upload K8s SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-k8s-results.sarif') != ''
        with:
          sarif_file: 'trivy-k8s-results.sarif'
          category: 'trivy-k8s'
      
      - name: Upload K8s SARIF Artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('trivy-k8s-results.sarif') != ''
        with:
          name: trivy-k8s-sarif
          path: trivy-k8s-results.sarif


  sca_scan:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code

        uses: actions/checkout@v7

        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker Image
        run: |
          docker build --no-cache -t devsecops-demo-app:latest .

      - name: Check installed Python packages
        run: |
          docker run --rm devsecops-demo-app:latest python -c "import msgpack, setuptools; print('msgpack:', msgpack.__version__); print('setuptools:', setuptools.__version__)"

      - name: Docker push to GitHub Container Registry
        run: |
          docker tag devsecops-demo-app:latest ghcr.io/${{ github.repository_owner }}/devsecops-demo-app:latest
          docker push ghcr.io/${{ github.repository_owner }}/devsecops-demo-app:latest


      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/devsecops-demo-app:latest'
          format: 'cyclonedx'
          output: 'sbom.json'
          
          
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: sbom.json

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          scanners: 'vuln'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          trivyignores: '.trivyignore'
        env:
          TRIVY_NO_CACHE: 'true'
          TRIVY_SEVERITY: 'HIGH,CRITICAL'

      - name: Debug - Trivy Human Readable Output
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-demo-app:latest'
          format: 'table'
          scanners: 'vuln'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'
      
      - name: Upload Trivy SARIF Artifact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif

  dast_scan:
    name: DAST (OWASP ZAP - Multi-Target)
    runs-on: ubuntu-latest
    needs: sca_scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build & Run Flask App
        run: |
          docker build --no-cache -t devsecops-demo-app:latest .
          docker run -d --name test-flask-app -p 5000:5000 devsecops-demo-app:latest
          sleep 5
   # Check if both apps are running   
      - name: Install & Run Node.js App
        run: |
          npm install express
          node app.js &
          sleep 5 
          
          curl -I "http://localhost:5000/greet?name=test"
          curl -I "http://localhost:3000/os-cmd/ping?host=127.0.0.1"

      
      - name: Prepare ZAP Output Dir
        run: |
          mkdir -p zap_out
          chmod 777 zap_out
          chmod 666 zap_rules.tsv || true

      # ZAP Even if Vulnerability Found: Flask App (Node.js scan will run regardless of Flask scan result)
      - name: OWASP ZAP Scan - Flask App
        run: |
          docker run --net=host \
            -v $(pwd)/zap_rules.tsv:/zap/wrk/zap_rules.tsv:ro \
            -v $(pwd)/zap_out:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t "http://localhost:5000/greet?name=test" \
            -c zap_rules.tsv \
            -r zap_report_flask.html \
            -J zap_report_flask.json \
            -I ||  echo "FLASK_FAILED=true" >> $GITHUB_ENV

      # ZAP Even if Vulnerability Found: Node.js App (Flask scan result does not affect Node.js scan)
      - name: OWASP ZAP Scan - Node.js App
        run: |
          docker run --net=host \
            -v $(pwd)/zap_rules.tsv:/zap/wrk/zap_rules.tsv:ro \
            -v $(pwd)/zap_out:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t "http://localhost:3000/os-cmd/ping?host=127.0.0.1" \
            -c zap_rules.tsv \
            -r zap_report_node.html \
            -J zap_report_node.json \
            -I || echo "NODE_FAILED=true" >> $GITHUB_ENV

      # Upload ZAP Reports as Artifacts
      - name: Upload All ZAP Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-multi-app-reports
          path: zap_out/

      # Last check for vulnerabilities and fail the job if any are found
      - name: Evaluate DAST Security Gate
        run: |
          if [ "$FLASK_FAILED" = "true" ] || [ "$NODE_FAILED" = "true" ]; then
            echo "::error:: Security vulnerabilities detected in DAST scan. Failing the job."
            exit 1
          fi
      - name: Stop and Remove Container
        if: always()
        run: |
          docker stop test-app || true
          docker rm test-app   || true

  sign_image:
      name: Sign Image (Cosign Keyless)
      runs-on: ubuntu-latest
      needs: [sast_scan, sast_codeql, secret_scan, sca_scan, dast_scan, k8s_manifest_scan]
      permissions:
        id-token: write
        packages: write
      steps:
        - name: Install Cosign
          uses: sigstore/cosign-installer@v4.1.2

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Sign Image (Keyless via OIDC)
          run: |
            cosign sign --yes ghcr.io/${{ github.repository_owner }}/devsecops-demo-app:latest

        - name: Verify Keyless Signature
          run: |
            cosign verify ghcr.io/${{ github.repository_owner }}/devsecops-demo-app:latest \
              --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/devsecops-pipeline" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
              
  deploy_staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: sign_image
    environment: staging
    steps:
      - name: Simulate staging deployment
        run: |
          echo "Deploying ghcr.io/${{ github.repository_owner }}/devsecops-demo-app:latest to STAGING..."
          echo "(No real cluster connected — this step demonstrates the promotion flow)"

  deploy_production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy_staging
    environment: production
    steps:
      - name: Simulate production deployment
        run: |
          echo "Deploying ghcr.io/${{ github.repository_owner }}/devsecops-demo-app:latest to PRODUCTION..."
          echo "(No real cluster connected — this step demonstrates the approval gate)"

  ai_triage:
    name: AI-Assisted Triage
    runs-on: ubuntu-latest
    needs: [sast_scan, sca_scan]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai

      - name: Download Bandit SARIF
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: bandit-sarif

      - name: Download Trivy SARIF
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: trivy-sarif

      - name: Run AI Triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_triage.py

      - name: Upload AI Triage Summary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-triage-summary
          path: ai_triage_summary.md 
            
  notify_on_failure:
      name: Notify on Pipeline Failure
      runs-on: ubuntu-latest
      needs: [sast_scan, sast_codeql, secret_scan, sca_scan, dast_scan, sign_image, deploy_staging, deploy_production]
      if: failure()
      steps:
        - name: Send Failure Email
          uses: dawidd6/action-send-mail@v18
          with:
            server_address: smtp.gmail.com
            server_port: 465
            username: ${{ secrets.MAIL_USERNAME }}
            password: ${{ secrets.MAIL_PASSWORD }}
            subject: "Failed - ${{ github.repository }}"
            to: okanuzun42@gmail.com
            from: DevSecOps Pipeline Bot
            body: |
              Pipeline failed on branch: ${{ github.ref_name }}
              Commit: ${{ github.sha }}
              Check the logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}